[project]
name = "ppt-king"
version = "0.2.0"
description = "从资料生成带网格排版的 PPT，并支持 PPTX 与 Markdown 互转"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "tenacity>=9.2.1",
]

[project.scripts]
ppt-king = "ppt_king:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
